<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>哔哩哔哩主题</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="window">
    <header class="title-bar">
      <span class="app-icon" aria-hidden="true">b.</span>
      <h1 data-i18n="appTitle">哔哩哔哩主题</h1>
      <span class="version">2.2.2</span>
      <button id="close-popup" class="window-close" type="button" aria-label="关闭" data-i18n-aria="close">×</button>
    </header>
    <form id="settings-form">
      <fieldset id="controls" disabled>
        <div class="window-body">
          <div class="toolbar">
            <label class="enabled-row"><input name="enabled" type="checkbox" checked><span data-i18n="enabled">启用主题</span></label>
            <label class="language-row"><span data-i18n="language">语言</span>
              <select name="language" id="language"><option value="zh">中文</option><option value="en">English</option></select>
            </label>
          </div>

          <section class="group" aria-labelledby="background-title">
            <h2 id="background-title" data-i18n="background">桌面背景</h2>
            <div class="section-heading"><span id="image-name">默认渐变</span></div>
            <div class="preview" id="preview">
              <span class="preview-label" id="preview-label">效果预览</span>
              <div class="preview-card" aria-hidden="true">
                <div class="preview-card-title"><span class="preview-dot"></span><strong data-i18n="previewTitle">内容面板</strong></div>
                <small data-i18n="previewSample">主题设置预览</small>
              </div>
            </div>
            <div class="image-actions">
              <button id="choose-image" type="button" data-i18n="chooseImage">浏览...</button>
              <button id="remove-image" type="button" data-i18n="removeImage">移除</button>
              <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" hidden>
            </div>
            <p class="hint" data-i18n="imageHint">图片只保存在本机；动图会转为静态背景。</p>
          </section>

          <section class="group" aria-labelledby="coverage-title">
            <h2 id="coverage-title" data-i18n="coverage">应用范围</h2>
            <div class="segmented">
              <input type="radio" name="coverage" id="coverage-all" value="all" checked><label for="coverage-all" data-i18n="coverageAll">全元素</label>
              <input type="radio" name="coverage" id="coverage-panels" value="panels"><label for="coverage-panels" data-i18n="coveragePanels">内容面板</label>
            </div>
            <p class="hint" id="coverage-note">清除页面底色，导航和内容面板显示毛玻璃。</p>
          </section>

          <section class="group" aria-labelledby="material-title">
            <h2 id="material-title" data-i18n="material">界面效果</h2>
            <div class="material-switch">
              <input type="radio" name="material" id="material-glass" value="glass" checked><label for="material-glass" data-i18n="glass">毛玻璃</label>
              <input type="radio" name="material" id="material-clear" value="clear"><label for="material-clear" data-i18n="clear">透明</label>
            </div>
            <div class="range-row"><label for="opacity" data-i18n="opacity">玻璃浓度</label><output id="opacity-value" for="opacity">58%</output><input name="opacity" id="opacity" type="range" min="0" max="90" value="58"></div>
            <div class="range-row"><label for="blur" data-i18n="blur">模糊强度</label><output id="blur-value" for="blur">14 px</output><input name="blur" id="blur" type="range" min="0" max="30" value="14"></div>
            <div class="accent-row"><label for="accent" data-i18n="accent">点缀色</label><input name="accent" id="accent" type="color" value="#63d5ff"></div>
          </section>
        </div>
        <footer class="status-bar"><span id="save-status" role="status" aria-live="polite">正在读取设置…</span><button id="reset" type="button" data-i18n="reset">恢复默认</button></footer>
      </fieldset>
    </form>
  </main>
  <script src="settings.js" defer></script>
  <script src="popup.js" defer></script>
</body>
</html>
